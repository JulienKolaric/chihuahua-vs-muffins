# Dedicated OGXServer for Hotline RAG — separate from Playground (lsd-genai-playground).
# Uses overrideConfig so inline sentence-transformers (embeddings) are registered —
# env-only ENABLE_PGVECTOR alone does not expose an embedding model (needed for ingest).
#
# Apply order: 01 → 02 → 04 → 03
#   oc apply -f manifests/hotline-rag/04-ogx-config.yaml -n genai-hotline
#   oc apply -f manifests/hotline-rag/03-ogxserver.yaml -n genai-hotline
---
apiVersion: ogx.io/v1beta1
kind: OGXServer
metadata:
  name: hotline-rag-ogx
  labels:
    app: hotline-rag
spec:
  distribution:
    name: rh-dev
  network:
    port: 8321
  overrideConfig:
    name: hotline-rag-ogx-config
    key: config.yaml
  workload:
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 500Mi
      limits:
        cpu: "2"
        memory: 12Gi
    overrides:
      env:
        - name: INFERENCE_MODEL
          valueFrom:
            secretKeyRef:
              name: hotline-rag-ogx-llm
              key: INFERENCE_MODEL
        - name: VLLM_URL
          valueFrom:
            secretKeyRef:
              name: hotline-rag-ogx-llm
              key: VLLM_URL
        - name: VLLM_TLS_VERIFY
          valueFrom:
            secretKeyRef:
              name: hotline-rag-ogx-llm
              key: VLLM_TLS_VERIFY
        - name: VLLM_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: hotline-rag-ogx-llm
              key: VLLM_API_TOKEN
        - name: VLLM_MAX_TOKENS
          valueFrom:
            secretKeyRef:
              name: hotline-rag-ogx-llm
              key: VLLM_MAX_TOKENS
        - name: POSTGRES_HOST
          value: hotline-rag-pgvector
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: hotline_rag
        - name: POSTGRES_USER
          value: hotline
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hotline-rag-pg-credentials
              key: POSTGRES_PASSWORD
        - name: ENABLE_PGVECTOR
          value: "true"
        - name: PGVECTOR_HOST
          valueFrom:
            secretKeyRef:
              name: hotline-rag-pgvector-connection
              key: PGVECTOR_HOST
        - name: PGVECTOR_PORT
          valueFrom:
            secretKeyRef:
              name: hotline-rag-pgvector-connection
              key: PGVECTOR_PORT
        - name: PGVECTOR_DB
          valueFrom:
            secretKeyRef:
              name: hotline-rag-pgvector-connection
              key: PGVECTOR_DB
        - name: PGVECTOR_USER
          valueFrom:
            secretKeyRef:
              name: hotline-rag-pgvector-connection
              key: PGVECTOR_USER
        - name: PGVECTOR_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hotline-rag-pgvector-connection
              key: PGVECTOR_PASSWORD
        # Embedding model weights ship in the OGX image (same as Playground)
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: TRANSFORMERS_OFFLINE
          value: "1"
        - name: HF_DATASETS_OFFLINE
          value: "1"
        - name: SENTENCE_TRANSFORMERS_HOME
          value: /opt/app-root/.cache/huggingface/hub
