# Connection secrets for dedicated Hotline RAG OGXServer (metadata + pgvector).
# Apply after 01-postgres-pgvector.yaml is Ready.
---
apiVersion: v1
kind: Secret
metadata:
  name: hotline-rag-pgvector-connection
  labels:
    app: hotline-rag
type: Opaque
stringData:
  PGVECTOR_HOST: hotline-rag-pgvector
  PGVECTOR_PORT: "5432"
  PGVECTOR_DB: hotline_rag
  PGVECTOR_USER: hotline
  PGVECTOR_PASSWORD: hotline-rag-lab-change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: hotline-rag-ogx-llm
  labels:
    app: hotline-rag
type: Opaque
stringData:
  # Reuse the Ready Granite deployment already in genai-hotline (no 2nd GPU).
  INFERENCE_MODEL: redhataigranite-40-h-tiny-fp8
  VLLM_URL: http://redhataigranite-40-h-tiny-fp8-predictor.genai-hotline.svc.cluster.local:8080/v1
  VLLM_TLS_VERIFY: "false"
  VLLM_API_TOKEN: "not-needed"
  VLLM_MAX_TOKENS: "4096"
