# PIPELINE DEFINITION
# Name: lab-smoke-hello
# Description: Step 9 smoke — hello-world only (one print task).
#
# What this does:
#   - Starts one pipeline pod
#   - Task "say-hello" prints: hello <name> from chihuahua-vs-muffin lab
#   - Default name = muffin
#   - Does NOT train, serve, or call TrustyAI
#
# Source: pipelines/smoke_hello.py
# Inputs:
#    name: str [Default: 'muffin']
components:
  comp-say-hello:
    executorLabel: exec-say-hello
    inputDefinitions:
      parameters:
        name:
          defaultValue: muffin
          isOptional: true
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-say-hello:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - say_hello
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef say_hello(name: str = \"muffin\") -> str:\n    msg = f\"hello\
          \ {name} from chihuahua-vs-muffin lab\"\n    print(msg)\n    return msg\n\
          \n"
        image: registry.access.redhat.com/ubi9/python-311:latest
pipelineInfo:
  description: 'Step 9 smoke: one print task'
  name: lab-smoke-hello
root:
  dag:
    tasks:
      say-hello:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-say-hello
        inputs:
          parameters:
            name:
              componentInputParameter: name
        taskInfo:
          name: say-hello
  inputDefinitions:
    parameters:
      name:
        defaultValue: muffin
        isOptional: true
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.17.0
